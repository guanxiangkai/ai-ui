packages:
  - packages/*

catalog:
  "@changesets/cli": 2.31.1
  "@types/node": 24.13.3
  "@element-plus/icons-vue": 2.3.2
  "@vitejs/plugin-vue": 6.0.8
  "@vue/compiler-sfc": 3.5.41
  "@vue/language-core": 3.3.9
  "@vue/test-utils": 2.4.11
  element-plus: 2.14.4
  happy-dom: 20.11.2
  pinia: 4.0.2
  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.9
  vite-plugin-dts: 5.0.3
  vitest: 4.1.10
  vue: 3.5.41
  vue-router: 5.2.0

# 新发布依赖至少隔离 24 小时；显式严格模式禁止在范围内没有成熟版本时静默回退。
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

overrides:
  js-beautify: 2.0.3
  # PostCSS 的传递依赖必须避开 CVE-2026-67213，固定到 3.x 已修复补丁。
  nanoid: 3.3.17
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest

registries:
  "@guanxiangkai": https://registry.npmjs.org/
