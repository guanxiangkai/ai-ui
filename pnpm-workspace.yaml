packages:
  - packages/*

catalog:
  "@changesets/cli": 3.0.3
  "@types/node": 24.13.5
  "@element-plus/icons-vue": 2.3.2
  "@vitejs/plugin-vue": 6.0.9
  "@vue/compiler-sfc": 3.5.43
  "@vue/language-core": 3.3.11
  "@vue/test-utils": 2.5.1
  element-plus: 2.14.5
  happy-dom: 20.14.5
  javascript-obfuscator: 5.7.0
  pinia: 4.0.3
  publint: 0.3.24
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vite-plus: 0.3.2
  unplugin-dts: 1.1.0
  vitest: 4.1.11
  vue: 3.5.43
  vue-router: 5.3.1

catalogs:
  # Vue SFC 宏解析和声明生成仍需要 TypeScript 6 的 JavaScript Compiler API。
  vueCompiler:
    typescript: 6.0.3

# 新发布依赖至少隔离 24 小时；显式严格模式禁止在范围内没有成熟版本时静默回退。
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

overrides:
  js-beautify: 2.0.3
  # PostCSS 的传递依赖固定到 3.x 安全补丁，覆盖 GHSA-2v37-7h3g-55p8。
  nanoid: 3.3.18
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest

registries:
  "@guanxiangkai": https://registry.npmjs.org/
