packages:
  - packages/*

catalog:
  "@changesets/cli": 3.0.3
  "@types/node": 26.6.6
  "@element-plus/icons-vue": 2.3.2
  "@vitejs/plugin-vue": 6.0.11
  "@vue/compiler-sfc": 3.5.46
  "@vue/language-core": 3.3.14
  "@vue/test-utils": 2.6.0
  element-plus: 2.14.8
  happy-dom: 21.0.4
  javascript-obfuscator: 5.10.1
  pinia: 4.1.0
  publint: 0.3.25
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  unplugin-dts: 1.1.2
  vitest: 5.1.1
  vue: 3.5.46
  vue-router: 5.5.1

catalogs:
  # Vue SFC 宏解析和声明生成仍需要 TypeScript 6 的 JavaScript Compiler API。
  vueCompiler:
    typescript: 6.0.3

# 新发布依赖至少隔离 24 小时；显式严格模式禁止在范围内没有成熟版本时静默回退。
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

overrides:
  js-beautify: 2.0.3
  # PostCSS 的传递依赖固定到 3.x 安全补丁，覆盖 GHSA-2v37-7h3g-55p8。
  nanoid: 3.3.20
  # 修复 npm 公告涉及的传递依赖。
  shell-quote: 1.12.0
  launch-editor: 2.14.2
  brace-expansion: 5.0.13
  source-map-js: 1.2.4
  # 仅调整 js-beautify 的两个跨主版本依赖，CI 验证 CLI 的通配符与缩进。
  "js-beautify@2.0.3>glob": 14.0.6
  "js-beautify@2.0.3>editorconfig": 4.0.1
  "@vercel/cli-config@0.2.7>zod": 4.6.7
  "undici@6": 6.29.1
  vite: "catalog:"
  vitest: "catalog:"

registries:
  "@guanxiangkai": https://registry.npmjs.org/
