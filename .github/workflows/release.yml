name: 发布软件包

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  publish:
    name: 验证并发布开源包
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: package-release
    steps:
      - name: 校验发布分支
        run: |
          set -eu
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "公开发布只能从 main 分支执行" >&2
            exit 1
          fi

      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24.19.0"
          cache: true

      - name: 安装依赖
        run: vp install --frozen-lockfile

      - name: 执行质量门禁
        run: vp run ready

      - name: 发布软件包
        run: vp pm publish --recursive --filter './packages/*' --tag latest --access public --no-git-checks -- --registry https://registry.npmjs.org/
