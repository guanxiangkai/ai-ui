name: 发布软件包

on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm 发布标签
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read
  packages: write

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  publish:
    name: 验证并发布开源包
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: package-release
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 校验发布分支
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          set -eu
          if [ "$DIST_TAG" = "latest" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "latest 只能从 main 分支发布" >&2
            exit 1
          fi
          if [ "$DIST_TAG" = "next" ] && [ "$GITHUB_REF" != "refs/heads/test" ]; then
            echo "next 只能从 test 分支发布" >&2
            exit 1
          fi

      - name: 检出源码
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 配置 Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "24.19.0"
          cache: true

      - name: 配置 GitHub Packages 认证
        run: |
          set -eu
          test -n "$NODE_AUTH_TOKEN"
          vp pm config set --location=user @guanxiangkai:registry https://npm.pkg.github.com
          vp pm config set --location=user //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          vp pm config set --location=user always-auth true

      - name: 安装依赖
        run: vp install --frozen-lockfile

      - name: 执行质量门禁
        run: vp run ready

      - name: 发布软件包
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
        run: vp pm --recursive --filter './packages/*' publish --tag "$DIST_TAG" --registry https://npm.pkg.github.com
