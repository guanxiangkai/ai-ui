version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    target-branch: main
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      frontend-toolchain:
        patterns:
          - "vite-plus"
          - "@voidzero-dev/*"
          - "vitest"
          - "typescript"
          - "@types/node"
      vue-platform:
        patterns:
          - "vue"
          - "vue-router"
          - "pinia"
          - "@vue/*"
          - "@vitejs/plugin-vue"
          - "element-plus"
          - "@element-plus/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    target-branch: main
