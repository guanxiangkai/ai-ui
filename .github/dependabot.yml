version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    target-branch: main
    groups:
      frontend-toolchain:
        patterns:
          - "@voidzero-dev/*"
          - typescript
          - vite-plus
          - vitest
      vue-platform:
        patterns:
          - vue
          - "@vue/*"
          - pinia
          - vue-router
          - element-plus
